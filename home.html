<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>園務資料查閱｜福祿貝爾營運中心</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<aside class="sidebar"><a class="brand" href="index.html"><img class="brand-logo" src="static/0-3-08.png" alt="福祿貝爾標誌"><span>福祿貝爾<small>園務營運中心</small></span></a><nav class="nav"><a href="index.html">園務總覽</a><a class="active" href="home.html">資料查閱</a><a href="sales.html">托育收費</a><a href="mis.html">人事權限</a><a href="exam.html">園務研習</a><a href="game.html">團隊小憩</a></nav><p class="sidebar-note">READ ONLY · 幼兒資料請妥善保護</p></aside>
<main class="main"><header class="topbar"><div><span class="top-kicker">園務資料管理</span><h1>SQL Server 唯讀查閱</h1></div><span class="api-state" id="apiState">正在連線資料庫</span></header>
<div class="db-workspace">
  <aside class="table-browser"><div class="browser-heading"><div><span class="eyebrow">DATABASE OBJECTS</span><h2>資料表</h2></div><span id="tableCount">—</span></div><label class="catalog-search"><span>搜尋</span><input id="catalogSearch" type="search" placeholder="輸入資料表名稱"></label><div class="catalog-list" id="catalog"><div class="empty">讀取中…</div></div></aside>
  <section class="data-viewer">
    <div class="viewer-head"><div><div class="table-path"><span id="schemaName">dbo</span> / <b id="tableName">ALLtable</b></div><h2 id="viewerTitle">教職員整合主檔</h2><p id="viewerMeta">依照園務資料庫的實際欄位規劃呈現</p></div><div class="viewer-status"><span class="read-only-badge">唯讀</span><span id="recordCount">— 筆</span></div></div>
    <div class="privacy-banner"><span>兒少資料保護</span><p>幼兒、家長與教職員的受限制欄位均由後端遮罩，原始證件、地址、電話、銀行與薪資值不會送到瀏覽器。</p></div>
    <section class="schema-strip" id="schemaStrip"><div class="empty">正在讀取欄位結構…</div></section>
    <section class="data-panel"><div class="table-scroll"><table class="database-table"><thead id="dataHead"></thead><tbody id="dataBody"><tr><td>正在讀取資料…</td></tr></tbody></table></div><footer class="pager"><span id="pageInfo">第 1 頁</span><div><button class="btn light" id="prevPage">上一頁</button><button class="btn light" id="nextPage">下一頁</button></div></footer></section>
  </section>
</div></main></div>
<script>
let tables=[],selected='ALLtable',page=1,currentTotal=0,currentPageSize=20;
const esc=value=>{const node=document.createElement('div');node.textContent=value??'';return node.innerHTML};const number=value=>new Intl.NumberFormat('zh-TW').format(value);
function renderCatalog(){const keyword=catalogSearch.value.trim().toLowerCase(),items=tables.filter(item=>item.name.toLowerCase().includes(keyword));catalog.innerHTML=items.length?items.map(item=>`<button class="catalog-item ${item.name===selected?'active':''}" data-table="${esc(item.name)}"><span class="table-icon">▦</span><span><b>${esc(item.name)}</b><small>${number(item.row_count)} 筆 · ${item.column_count} 欄</small></span></button>`).join(''):'<div class="empty">找不到資料表</div>'}
function classificationLabel(level){return level==='restricted'?'受限制':level==='personal'?'個人資料':'內部'}
async function loadTable(name,newPage=1){selected=name;page=newPage;renderCatalog();schemaStrip.innerHTML='<div class="empty">正在讀取欄位結構…</div>';dataHead.innerHTML='';dataBody.innerHTML='<tr><td>正在讀取資料…</td></tr>';try{const response=await fetch(`/api/table?name=${encodeURIComponent(name)}&page=${page}&page_size=${currentPageSize}`);const body=await response.json();if(!response.ok)throw new Error(body.error||'查詢失敗');const result=body.data;currentTotal=result.total;schemaName.textContent=result.schema;tableName.textContent=result.table;viewerTitle.textContent=result.table==='ALLtable'?'教職員整合主檔':result.table;viewerMeta.textContent=`${result.columns.length} 個欄位 · SQL Server 即時查詢`;recordCount.textContent=`${number(result.total)} 筆`;schemaStrip.innerHTML=result.columns.map(column=>`<article class="schema-field ${column.classification}"><b>${esc(column.name)}</b><span>${esc(column.type)}</span><small>${column.nullable?'允許 Null':'必要欄位'} · ${classificationLabel(column.classification)}</small></article>`).join('');dataHead.innerHTML=`<tr>${result.columns.map(column=>`<th><span>${esc(column.name)}</span><small>${esc(column.type)}</small></th>`).join('')}</tr>`;dataBody.innerHTML=result.rows.length?result.rows.map(row=>`<tr>${result.columns.map(column=>`<td class="${column.classification}">${row[column.name]===null?'<span class="null-value">NULL</span>':esc(row[column.name])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${result.columns.length}">此資料表目前沒有資料。</td></tr>`;const totalPages=Math.max(1,Math.ceil(result.total/result.page_size));pageInfo.textContent=`第 ${result.page} / ${totalPages} 頁`;prevPage.disabled=result.page<=1;nextPage.disabled=result.page>=totalPages;apiState.textContent='SQL Server 即時連線';apiState.classList.add('ok')}catch(error){dataBody.innerHTML=`<tr><td><div class="error-note">${esc(error.message)}</div></td></tr>`;apiState.textContent='資料庫查詢失敗'}}
fetch('/api/catalog').then(response=>{if(!response.ok)throw new Error();return response.json()}).then(body=>{tables=body.data;tableCount.textContent=`${tables.length} 張`;renderCatalog();loadTable(tables.some(item=>item.name==='ALLtable')?'ALLtable':tables[0]?.name)}).catch(()=>{catalog.innerHTML='<div class="error-note">無法取得資料表目錄。</div>';apiState.textContent='資料庫未連線'});
catalogSearch.addEventListener('input',renderCatalog);catalog.addEventListener('click',event=>{const button=event.target.closest('[data-table]');if(button)loadTable(button.dataset.table,1)});prevPage.onclick=()=>{if(page>1)loadTable(selected,page-1)};nextPage.onclick=()=>{if(page*currentPageSize<currentTotal)loadTable(selected,page+1)};
</script></body></html>
