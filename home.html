<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP 知識百科首頁</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft JhengHei",Arial,sans-serif}body{display:flex;min-height:100vh;background:#f4f6f9;color:#1e293b}.sidebar{width:240px;background:#1e293b;color:#fff;flex-shrink:0}.sidebar h2{padding:20px;text-align:center;font-size:18px;background:#0f172a}.sidebar nav a{display:block;padding:14px 20px;color:#94a3b8;text-decoration:none;border-left:4px solid transparent}.sidebar nav a:hover,.sidebar nav a.active{background:#334155;color:#fff;border-left-color:#3b82f6}.main-content{flex:1;min-width:0}header{background:#fff;padding:16px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 4px #0000000d}.back-link{color:#64748b;text-decoration:none}.container{padding:30px;max-width:1200px;margin:auto}.hero{background:linear-gradient(135deg,#1d4ed8,#38bdf8);color:#fff;padding:30px;border-radius:12px;margin-bottom:24px}.hero p{margin:8px 0 20px;opacity:.9}.search-wrap{position:relative}.search-wrap input{width:100%;padding:14px 46px 14px 16px;border:0;border-radius:8px;font-size:16px;outline:none}.search-icon{position:absolute;right:16px;top:13px;color:#64748b}.section-title{margin:24px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card,.result{background:#fff;border:1px solid #e2e8f0;border-radius:9px;padding:18px;cursor:pointer;box-shadow:0 2px 6px #0000000d;transition:.2s}.card:hover,.result:hover{transform:translateY(-2px);border-color:#3b82f6}.card .icon{font-size:28px}.card h3{margin:10px 0 6px}.card p,.result p{color:#64748b;font-size:14px;line-height:1.6}.tag{display:inline-block;margin-top:10px;padding:3px 8px;border-radius:12px;background:#dbeafe;color:#1d4ed8;font-size:12px}.results{display:grid;gap:10px}.result h3{margin-bottom:5px}.empty{background:#fff;padding:28px;text-align:center;color:#64748b;border-radius:8px}.modal{position:fixed;inset:0;background:#0f172acc;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modal-box{background:#fff;width:min(620px,100%);max-height:85vh;overflow:auto;border-radius:12px;padding:26px;position:relative}.close{position:absolute;right:16px;top:12px;border:0;background:transparent;font-size:28px;cursor:pointer}.modal-box h2{padding-right:34px}.modal-box .summary{color:#3b82f6;margin:8px 0 16px}.modal-box .detail{line-height:1.8;white-space:pre-line}.related{margin-top:18px;padding:14px;background:#f8fafc;border-radius:8px}@media(max-width:760px){body{display:block}.sidebar{width:100%}.sidebar nav{display:flex;overflow-x:auto}.sidebar nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.sidebar nav a.active{border-bottom-color:#3b82f6}.container{padding:18px}header{padding:14px 18px}}
    </style>
</head>
<body>
    <aside class="sidebar"><h2>ERP 知識學習中心</h2><nav><a href="home.html" class="active">🏠 知識百科</a><a href="sales.html">📊 銷貨流程</a><a href="mis.html">⚙️ 權限知識庫</a><a href="exam.html">📝 模擬考試</a><a href="game.html">🎮 紓壓遊戲</a></nav></aside>
    <main class="main-content">
        <header><h2>ERP 知識百科</h2><a class="back-link" href="index.html">返回入口首頁</a></header>
        <div class="container">
            <section class="hero"><h1>今天想了解哪個 ERP 名詞？</h1><p>輸入名詞、流程或部門，立即找到易懂的實務說明。</p><div class="search-wrap"><label for="search" style="position:absolute;left:-9999px">搜尋知識條目</label><input id="search" type="search" placeholder="例如：銷貨單、MIS 權限、月底結轉…" autocomplete="off"><span class="search-icon">🔍</span></div></section>
            <h2 class="section-title">熱門知識條目</h2><div class="grid" id="popular"></div>
            <h2 class="section-title">快速檢索入口</h2><div class="grid">
                <article class="card" data-keyword="銷貨"><div class="icon">🧾</div><h3>銷貨與訂單</h3><p>從報價、訂單到出貨與請款。</p><span class="tag">前往檢索</span></article>
                <article class="card" data-keyword="權限"><div class="icon">🔐</div><h3>MIS 與權限</h3><p>認識角色、最小權限與稽核觀念。</p><span class="tag">前往檢索</span></article>
                <article class="card" data-keyword="結轉"><div class="icon">📅</div><h3>月底與會計</h3><p>掌握關帳、結轉與檢核步驟。</p><span class="tag">前往檢索</span></article>
            </div>
            <section id="resultSection" hidden><h2 class="section-title">搜尋結果 <small id="count"></small></h2><div class="results" id="results"></div></section>
        </div>
    </main>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-box"><button class="close" aria-label="關閉">×</button><h2 id="modalTitle"></h2><p class="summary" id="modalSummary"></p><div class="detail" id="modalDetail"></div><div class="related" id="modalRelated"></div></div></div>
    <script>
        // 百科資料集中管理，搜尋與彈出說明共用同一份內容。
        const knowledge=[
            {id:'sales',title:'什麼是銷貨單？',summary:'記錄商品或服務已售出的核心交易單據。',category:'銷貨',keywords:'銷售 出貨 客戶 應收 SA',detail:'銷貨單記錄客戶、品項、數量、單價、稅額與出貨資訊，通常由訂單轉入。\n\n確認後會影響庫存與應收帳款，因此修改與作廢都應保留軌跡。',related:'延伸：報價 → 訂單 → 出貨 → 銷貨 → 請款'},
            {id:'permission',title:'MIS 權限等級定義',summary:'依工作職責限制資料的閱讀、建立、修改與核准。',category:'權限',keywords:'MIS 角色 資安 管理員 業務 會計',detail:'權限設計應採最小權限原則，只開放完成工作所需功能。高風險操作宜加入覆核、操作日誌與定期盤點。',related:'延伸：角色權限矩陣、職務分離、稽核軌跡'},
            {id:'closing',title:'月底結轉流程',summary:'彙整當月交易並將資料帶入下一會計期間。',category:'會計',keywords:'月結 關帳 結轉 財務 庫存',detail:'標準步驟包含：確認單據完整、盤點庫存、核對應收應付、計算成本、產生傳票、試算平衡與關閉期間。\n\n結轉前應備份並由負責人覆核。',related:'延伸：會計期間、試算平衡、成本結算'},
            {id:'quote',title:'報價單與訂單的差異',summary:'報價是交易提案，訂單則代表客戶已確認購買。',category:'銷貨',keywords:'報價 訂單 quotation order',detail:'報價單用來提出價格、數量與有效期限；客戶接受後才轉為訂單。訂單是後續備貨與出貨的依據，但通常尚未形成應收帳款。',related:'延伸：銷貨流程互動說明表'},
            {id:'inventory',title:'庫存可用量與帳面量',summary:'帳面庫存扣除已配置訂單後，才是可承諾數量。',category:'庫存',keywords:'庫存 倉庫 安全庫存 可用量',detail:'帳面量是系統記錄的現有數量；可用量會再扣除已被訂單保留的數量。實際量仍須透過盤點確認。',related:'延伸：安全庫存、盤點差異、批號管理'},
            {id:'audit',title:'操作日誌為什麼重要？',summary:'保留誰在何時做了什麼，協助追查與稽核。',category:'權限',keywords:'Log 日誌 稽核 軌跡 資安',detail:'操作日誌至少應記錄帳號、時間、來源、功能、異動前後內容與結果。日誌不應讓一般使用者任意修改或刪除。',related:'延伸：異常登入、權限異動、資料存取紀錄'}
        ];
        const popular=document.getElementById('popular'),results=document.getElementById('results'),search=document.getElementById('search'),section=document.getElementById('resultSection'),modal=document.getElementById('modal');
        function card(item){return `<article class="card" data-id="${item.id}" tabindex="0"><span class="tag">${item.category}</span><h3>${item.title}</h3><p>${item.summary}</p></article>`}
        popular.innerHTML=knowledge.slice(0,3).map(card).join('');
        function render(query){const q=query.trim().toLowerCase();section.hidden=!q;if(!q)return;const found=knowledge.filter(x=>`${x.title} ${x.summary} ${x.category} ${x.keywords}`.toLowerCase().includes(q));document.getElementById('count').textContent=`（${found.length} 筆）`;results.innerHTML=found.length?found.map(x=>`<article class="result" data-id="${x.id}" tabindex="0"><h3>${x.title}</h3><p>${x.summary}</p></article>`).join(''):'<div class="empty">找不到相符條目，試試「銷貨」、「權限」或「結轉」。</div>'}
        function openItem(id){const x=knowledge.find(item=>item.id===id);if(!x)return;document.getElementById('modalTitle').textContent=x.title;document.getElementById('modalSummary').textContent=x.summary;document.getElementById('modalDetail').textContent=x.detail;document.getElementById('modalRelated').textContent=x.related;modal.classList.add('open');modal.querySelector('.close').focus()}
        search.addEventListener('input',e=>render(e.target.value));document.addEventListener('click',e=>{const item=e.target.closest('[data-id]');if(item)openItem(item.dataset.id);const quick=e.target.closest('[data-keyword]');if(quick){search.value=quick.dataset.keyword;render(search.value);search.focus()}if(e.target===modal||e.target.closest('.close'))modal.classList.remove('open')});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.id)openItem(e.target.dataset.id);if(e.key==='Escape')modal.classList.remove('open')});
    </script>
</body>
</html>
