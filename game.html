<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>企業宣導影音｜銀盾共同體營運中心</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="portal-shell">
        <aside class="portal-sidebar">
            <a class="portal-brand" href="home.html">
                <span><b>銀盾共同體</b><small>員工入口網站</small>
                </span></a>
            <nav class="portal-nav" aria-label="內部系統導覽">
                <a href="home.html">工作台</a>
                <a href="sales.html">營運日報</a>
                <a href="exam.html">內部營運手冊</a>
                <a class="active" href="game.html">宣導影音</a>
                <a href="staff.html">員工出缺勤</a>
                <a href="mis.html">後台管理</a>
            </nav>
            <p class="portal-foot">TRAINING MEDIA · 內部使用</p>
        </aside>
        <main class="portal-main">
            <header class="portal-topbar">
                <div><span class="top-kicker">TRAINING MEDIA</span>
                    <h1>企業宣導影音</h1>
                </div>
                <span class="api-state ok" id="playerState">播放器就緒</span>
            </header>
            <div class="portal-content">
                <section class="portal-card youtube-control">
                    <div class="card-head">
                        <div><span class="eyebrow">INTERNAL BROADCAST</span>
                            <h2>載入宣導影音</h2>
                            <p>支援 YouTube 一般影片、直播、Shorts、分享短網址及嵌入網址；若來源禁止外部嵌入，請改由原站觀看。</p>
                        </div>
                    </div>
                    <form id="youtubeForm" class="youtube-form">
                        <label class="field" for="youtubeUrl"><span>YouTube 網址</span>
                            <input id="youtubeUrl" name="url" type="url" inputmode="url" autocomplete="url"
                                value="https://www.youtube.com/watch?v=ESjUACajP8c"
                                placeholder="https://www.youtube.com/watch?v=..." required></label>
                        <button class="btn" type="submit">轉換並播放</button>
                    </form>
                    <p class="hint" id="youtubeStatus" aria-live="polite">正在確認測試影片並取得標題…</p>
                </section>

                <section class="portal-card youtube-stage">
                    <div class="youtube-player">
                        <iframe id="youtubePlayer" title="YouTube播放器" frameborder="0" allow="accelerometer;
                          autoplay; clipboard-write; encrypted-media; gyroscope;
                              picture-in-picture;
                              web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                        </iframe>
                    </div>
                    <div class="youtube-meta">
                        <div><span class="eyebrow">NOW PLAYING</span>
                            <h2 id="videoTitle">正在取得影片資訊…</h2>
                        </div>
                        <a class="btn secondary" id="openYoutube" href="https://www.youtube.com/watch?v=fxnjjVyMd7g"
                            target="_blank" rel="noopener noreferrer">YouTube 開啟</a>
                </section>
            </div>
        </main>
    </div>

    <script>
        const DEFAULT_URL = 'https://www.youtube.com/watch?v=fxnjjVyMd7g';
        const youtubeForm = document.querySelector('#youtubeForm'), youtubeUrl = document.querySelector('#youtubeUrl'), youtubePlayer = document.querySelector('#youtubePlayer'), youtubeStatus = document.querySelector('#youtubeStatus'), playerState = document.querySelector('#playerState'), videoTitle = document.querySelector('#videoTitle'), openYoutube = document.querySelector('#openYoutube'), submitButton = youtubeForm.querySelector('button[type="submit"]');
        const loginUrl = `employee-login.html?next=${encodeURIComponent(location.pathname)}`;
        const employeeAccess = fetch('/api/employee/session', {
            credentials: 'include'
        }).then(r => r.json()).then(body => {
            if (!body.data?.authenticated) {
                location.replace(loginUrl);
                throw new Error('需要員工驗證')
            } return body.data
        });
        async function resolveVideo(url, remember = true) {
            const controller = new AbortController(),
                timer = setTimeout(() => controller.abort(), 10000);
            submitButton.disabled = true;
            playerState.textContent = '後端驗證中';
            youtubeStatus.className = 'hint';
            youtubeStatus.textContent = '正在確認影片並取得標題…';
            try {
                await employeeAccess;
                const response = await fetch('/api/youtube/resolve', {
                    method: 'POST', credentials: 'include', headers: {
                        'Content-Type': 'application/json'
                    }, body: JSON.stringify({ url }),
                    signal: controller.signal
                });
                const body = await response.json().catch(() => ({}));
                if (response.status === 401) location.replace(loginUrl);
                if (!response.ok) throw new Error(body.error || '影片資訊取得失敗');
                const video = body.data;
                youtubePlayer.src = video.embed_url;
                videoTitle.textContent = video.title;
                openYoutube.href = video.watch_url;
                youtubeUrl.value = video.watch_url;
                if (remember) localStorage.setItem('silverShieldTrainingVideo', video.watch_url);
                youtubeStatus.className = 'hint success-note';
                youtubeStatus.textContent = '後端已驗證網址並取得 YouTube 影片標題。';
                playerState.textContent = '播放器已更新';
            } catch (error) {
                const message = error.name === 'AbortError' ? '影片資訊讀取逾時，請稍後重試。' : error.message;
                youtubeStatus.className = 'error-note';
                youtubeStatus.textContent = message; playerState.textContent = '影片載入失敗';
            } finally {
                clearTimeout(timer);
                submitButton.disabled = false
            }
        }
        youtubeForm.addEventListener('submit', event => {
            event.preventDefault();
            resolveVideo(youtubeUrl.value);
        });
        const savedUrl = localStorage.getItem('silverShieldTrainingVideo');
        resolveVideo(savedUrl || DEFAULT_URL, false);
    </script>
</body>

</html>
