<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>資料名詞配對｜福祿貝爾營運中心</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar"><a class="brand" href="index.html"><img class="brand-logo" src="static/0-3-08.png" alt="福祿貝爾標誌"><span>福祿貝爾<small>園務營運中心</small></span></a>
            <nav class="nav"><a href="index.html">園務總覽</a><a href="home.html">資料查閱</a><a href="sales.html">托育收費</a><a
                    href="mis.html">人事權限</a><a href="exam.html">園務研習</a><a class="active" href="game.html">團隊小憩</a>
            </nav>
        </aside>
        <main class="main">
            <header class="topbar">
                <h1>幼稚園園務名詞配對</h1><span class="api-state ok" id="apiState">遊戲就緒</span>
            </header>
            <div class="container">
                <section class="section-head">
                    <div><span class="eyebrow">MEMORY BREAK</span>
                        <h2>翻開卡片，找出四組流程搭檔</h2>
                        <p>沒有倒數、沒有壓力，讓腦袋換個節奏。</p>
                    </div><button class="btn light" id="restart">重新洗牌</button>
                </section>
                <div class="split">
                    <section class="panel">
                        <div class="game-board" id="board"></div>
                    </section>
                    <section class="panel"><span class="eyebrow">YOUR RUN</span>
                        <h2><span id="moves">0</span> 次翻牌</h2>
                        <p class="hint">已完成 <span id="pairs">0</span> / 4 組</p>
                        <div class="progress" style="margin:18px 0"><span id="bar" style="width:0"></span></div>
                        <p id="message">先從任何一張卡片開始。</p>
                        <div class="panel"><b>配對提示</b>
                            <p class="hint">每組由「流程名詞」與「功能說明」組成。</p>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script>const source = [['幼兒學籍', '入園與班級'], ['學籍異動', '保留歷程'], ['繳費記錄', '托育收費'], ['接送資料', '安全聯絡']]; let deck = [], open = [], matched = 0, count = 0, busy = false; function start() { deck = source.flatMap((p, i) => p.map(text => ({ pair: i, text }))).sort(() => Math.random() - .5); open = []; matched = 0; count = 0; busy = false; moves.textContent = 0; pairs.textContent = 0; bar.style.width = '0'; message.textContent = '先從任何一張卡片開始。'; board.innerHTML = deck.map((x, i) => `<button class="game-card" data-index="${i}" aria-label="未翻開卡片">${x.text}</button>`).join('') } board.onclick = e => { const b = e.target.closest('[data-index]'); if (!b || busy || b.classList.contains('open') || b.classList.contains('matched')) return; b.classList.add('open'); open.push({ b, item: deck[Number(b.dataset.index)] }); if (open.length < 2) return; count++; moves.textContent = count; const [a, c] = open; if (a.item.pair === c.item.pair) { a.b.classList.add('matched'); c.b.classList.add('matched'); open = []; matched++; pairs.textContent = matched; bar.style.width = `${matched / 4 * 100}%`; message.textContent = matched === 4 ? '全數配對完成，做得好！' : '找到一組，再接再厲。' } else { busy = true; message.textContent = '不是這組，記住位置再試一次。'; setTimeout(() => { a.b.classList.remove('open'); c.b.classList.remove('open'); open = []; busy = false }, 700) } }; restart.onclick = start; start()</script>
</body>

</html>
