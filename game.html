<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>休閒專區｜福祿貝爾營運中心</title><link rel="stylesheet" href="style.css"></head><body><div class="portal-shell"><aside class="portal-sidebar"><a class="portal-brand" href="home.html"><img src="static/0-3-08.png" alt="福祿貝爾標誌"><span><b>福祿貝爾</b><small>員工入口網站</small></span></a><nav class="portal-nav"><a href="home.html">工作台</a><a href="sales.html">營運蒐集</a><a href="exam.html">教育訓練</a><a class="active" href="game.html">休閒專區</a><a href="mis.html">MIS 管理</a><a href="index.html">官方網站</a></nav></aside><main class="portal-main"><header class="portal-topbar"><div><span class="top-kicker">TAKE A BREAK</span><h1>翻牌小憩</h1></div><span class="api-state ok">遊戲就緒</span></header><div class="portal-content"><div class="card-head"><div><span class="eyebrow">MEMORY GAME</span><h2>放鬆一下，找出四組生活搭檔</h2><p>沒有倒數、沒有排名，讓腦袋換個節奏。</p></div><button class="btn secondary" id="restart">重新洗牌</button></div><div class="portal-grid"><section class="portal-card wide"><div class="game-board" id="board"></div></section><aside class="portal-card narrow"><span class="eyebrow">YOUR RUN</span><h2><span id="moves">0</span> 次翻牌</h2><p class="hint">已完成 <span id="pairs">0</span> / 4 組</p><div class="progress" style="margin:18px 0"><span id="bar" style="width:0"></span></div><p id="message">先從任何一張卡片開始。</p></aside></div></div></main></div><script>
const board=document.querySelector('#board'),moves=document.querySelector('#moves'),pairs=document.querySelector('#pairs'),bar=document.querySelector('#bar'),message=document.querySelector('#message'),restart=document.querySelector('#restart');const source=[['咖啡','休息片刻'],['音樂','放鬆心情'],['散步','舒展身體'],['微笑','分享溫暖']];let deck=[],open=[],matched=0,count=0,busy=false;function start(){deck=source.flatMap((pair,id)=>pair.map(text=>({id,text}))).sort(()=>Math.random()-.5);open=[];matched=0;count=0;busy=false;moves.textContent=0;pairs.textContent=0;bar.style.width='0';message.textContent='先從任何一張卡片開始。';board.innerHTML=deck.map((item,index)=>`<button class="game-card" data-index="${index}" aria-label="未翻開卡片">${item.text}</button>`).join('')}board.onclick=e=>{const button=e.target.closest('[data-index]');if(!button||busy||button.classList.contains('open')||button.classList.contains('matched'))return;button.classList.add('open');open.push({button,item:deck[Number(button.dataset.index)]});if(open.length<2)return;count++;moves.textContent=count;const[a,b]=open;if(a.item.id===b.item.id){a.button.classList.add('matched');b.button.classList.add('matched');open=[];matched++;pairs.textContent=matched;bar.style.width=`${matched/4*100}%`;message.textContent=matched===4?'全部完成，帶著輕鬆心情回到工作吧！':'找到一組，再接再厲。'}else{busy=true;message.textContent='不是這組，記住位置再試一次。';setTimeout(()=>{a.button.classList.remove('open');b.button.classList.remove('open');open=[];busy=false},700)}};restart.onclick=start;start();
</script></body></html>
