<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教育訓練｜福祿貝爾營運中心</title><link rel="stylesheet" href="style.css"></head><body><div class="portal-shell"><aside class="portal-sidebar"><a class="portal-brand" href="home.html"><img src="static/0-3-08.png" alt="福祿貝爾標誌"><span><b>福祿貝爾</b><small>員工入口網站</small></span></a><nav class="portal-nav"><a href="home.html">工作台</a><a href="sales.html">營運蒐集</a><a class="active" href="exam.html">教育訓練</a><a href="game.html">休閒專區</a><a href="mis.html">MIS 管理</a><a href="index.html">官方網站</a></nav></aside><main class="portal-main"><header class="portal-topbar"><div><span class="top-kicker">EMPLOYEE TRAINING</span><h1>兒少資料與園務安全研習</h1></div><span class="api-state" id="apiState">載入題庫</span></header><div class="portal-content"><div class="card-head"><div><span class="eyebrow">QUICK CHECK</span><h2>四題完成今日園務研習</h2><p>涵蓋兒少資料、托育收費、權限與接送安全。</p></div><button class="btn secondary" id="restart">重新作答</button></div><div class="progress"><span id="bar" style="width:0"></span></div><section class="portal-card full" id="quiz" style="max-width:800px;margin:20px auto"><div class="empty">正在準備題目…</div></section></div></main></div><script>
let questions=[],at=0,score=0,locked=false;const quiz=document.querySelector('#quiz'),bar=document.querySelector('#bar'),restart=document.querySelector('#restart'),apiState=document.querySelector('#apiState');const esc=v=>{const n=document.createElement('div');n.textContent=v??'';return n.innerHTML};function reset(){at=0;score=0;render()}function render(){if(at>=questions.length){quiz.innerHTML=`<span class="eyebrow">RESULT</span><h2>完成！答對 ${score} / ${questions.length} 題</h2><p class="hint">${score===questions.length?'觀念非常完整，謝謝你一起守護幼兒資料。':'建議回顧解說後再挑戰一次。'}</p><button class="btn" id="again">再考一次</button>`;bar.style.width='100%';quiz.querySelector('#again').onclick=reset;return}locked=false;const q=questions[at];bar.style.width=`${at/questions.length*100}%`;quiz.innerHTML=`<span class="tag">${esc(q.category)}</span><p class="hint">第 ${at+1} 題，共 ${questions.length} 題</p><h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<button class="quiz-option" data-index="${i}">${esc(o)}</button>`).join('')}<p id="feedback"></p><button class="btn" id="next" hidden>${at===questions.length-1?'查看結果':'下一題'}</button>`}quiz.onclick=e=>{const option=e.target.closest('[data-index]');if(option&&!locked){locked=true;const q=questions[at],chosen=Number(option.dataset.index);quiz.querySelectorAll('[data-index]').forEach((b,i)=>{if(i===q.answer)b.classList.add('correct');else if(i===chosen)b.classList.add('wrong');b.disabled=true});if(chosen===q.answer)score++;quiz.querySelector('#feedback').textContent=`${chosen===q.answer?'答對了。':'再想一下。'}${q.explanation}`;quiz.querySelector('#next').hidden=false}if(e.target.id==='next'){at++;render()}};restart.onclick=reset;fetch('/api/questions').then(r=>r.json()).then(({data})=>{questions=data;apiState.textContent='研習題庫已載入';apiState.classList.add('ok');render()}).catch(()=>{quiz.innerHTML='<div class="error-note">題庫載入失敗。</div>'});
</script></body></html>
