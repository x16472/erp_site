<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>園務資料治理研習｜福祿貝爾營運中心</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<aside class="sidebar"><a class="brand" href="index.html"><img class="brand-logo" src="static/0-3-08.png" alt="福祿貝爾標誌"><span>福祿貝爾<small>園務營運中心</small></span></a><nav class="nav"><a href="index.html">園務總覽</a><a href="home.html">資料查閱</a><a href="sales.html">托育收費</a><a href="mis.html">人事權限</a><a class="active" href="exam.html">園務研習</a><a href="game.html">團隊小憩</a></nav></aside>
<main class="main"><header class="topbar"><div><span class="top-kicker">教職員研習</span><h1>幼兒園資料治理研習</h1></div><span class="api-state" id="apiState">等待開始</span></header><div class="container"><section class="section-head"><div><span class="eyebrow">QUICK CHECK</span><h2>四題，確認園務資料使用觀念</h2><p>聚焦兒少資料保護、托育收費、最小權限與接送安全。</p></div><button class="btn light" id="restart">重新作答</button></section><div class="progress"><span id="bar" style="width:0"></span></div><section class="panel" id="quiz" style="max-width:780px;margin:22px auto"><div class="empty">正在準備題目…</div></section></div></main></div>
<script>
let questions=[],at=0,score=0,locked=false;const esc=value=>{const node=document.createElement('div');node.textContent=value??'';return node.innerHTML};
function render(){if(at>=questions.length){const message=score===questions.length?'兒少資料保護觀念非常完整。':score>=questions.length/2?'基礎不錯，建議回資料查閱頁複習相關資料域。':'先從園務總覽理解核心流程，再挑戰一次。';quiz.innerHTML=`<span class="eyebrow">RESULT</span><h2>完成！答對 ${score} / ${questions.length} 題</h2><p class="hint">${message}</p><div class="actions"><a class="btn" href="index.html">回園務總覽</a><button class="btn light" id="again">再考一次</button></div>`;bar.style.width='100%';quiz.querySelector('#again').onclick=reset;return}locked=false;const question=questions[at];bar.style.width=`${at/questions.length*100}%`;quiz.innerHTML=`<span class="tag">${esc(question.category)}</span><p class="hint">第 ${at+1} 題，共 ${questions.length} 題</p><h2>${esc(question.question)}</h2><div id="options">${question.options.map((option,index)=>`<button class="quiz-option" data-index="${index}">${esc(option)}</button>`).join('')}</div><p id="feedback"></p><button class="btn" id="next" hidden>${at===questions.length-1?'查看結果':'下一題'}</button>`}
quiz.addEventListener('click',event=>{const option=event.target.closest('[data-index]');if(option&&!locked){locked=true;const question=questions[at],chosen=Number(option.dataset.index);quiz.querySelectorAll('[data-index]').forEach((button,index)=>{if(index===question.answer)button.classList.add('correct');else if(index===chosen)button.classList.add('wrong');button.disabled=true});if(chosen===question.answer)score++;feedback.textContent=`${chosen===question.answer?'答對了。':'再想一下。'}${question.explanation}`;next.hidden=false}if(event.target.id==='next'){at++;render()}});
function reset(){at=0;score=0;render()}restart.onclick=reset;fetch('/api/questions').then(response=>{if(!response.ok)throw new Error();return response.json()}).then(body=>{questions=body.data;apiState.textContent='研習題庫已載入';apiState.classList.add('ok');render()}).catch(()=>{quiz.innerHTML='<div class="error-note">無法取得研習題庫，請確認後端服務。</div>';apiState.textContent='資料服務未連線'});
</script></body></html>
