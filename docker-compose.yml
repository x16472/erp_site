services:
  erp_service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    image: ${ERP_IMAGE:-erp-site:alpine}
    container_name: ERP_Site
    restart: unless-stopped
    stop_grace_period: 110s
    environment:
      NAME: ERP_Site
      WEB_HOST: '0.0.0.0'
      WEB_PORT: '8080'
      ERP_PYTHON: /app/.venv/bin/python
      ERP_SKIP_DOC_SYNC: '0'
      ERP_TLS_PROXY: '1'
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /app/data
      - staff_photos:/app/page/static/staff

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflared_token"]
    depends_on:
      erp_service:
        condition: service_healthy
    secrets:
      - cloudflared_token

secrets:
  cloudflared_token:
    file: ./secrets/cloudflared-token.txt

volumes:
  staff_photos:
