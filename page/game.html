<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>企業宣導中心｜銀盾共同體營運中心</title>
    <link rel="stylesheet" href="./static/style.css">
</head>

<body>
    <div class="portal-shell">
        <aside class="portal-sidebar">
            <a class="portal-brand" href="home.html">
                <span><b>銀盾共同體</b><small>員工入口網站</small>
                </span></a>
            <nav class="portal-nav" aria-label="內部系統導覽">
                <a href="home.html">工作台</a>
                <a href="sales.html">營運日報</a>
                <a href="exam.html">題庫練習</a>
                <a class="active" href="game.html">宣導影音</a>
                <a href="staff.html">員工出缺勤</a>
                <a href="mis.html">後台管理</a>
            </nav>
            <p class="portal-foot">Media · 內部使用</p>
        </aside>
        <main class="portal-main">
            <header class="portal-topbar">
                <div><span class="top-kicker">Media</span>
                    <h1>企業宣導影音</h1>
                </div>
                <span class="api-state ok" id="playerState">播放器就緒</span>
            </header>
            <div class="portal-content">
                <section class="portal-card youtube-control">
                    <div class="card-head">
                        <div><span class="eyebrow">INTERNAL BROADCAST</span>
                            <h2>載入宣導影音</h2>
                            <p>支援 YouTube 一般影片、直播、Shorts、分享短網址及嵌入網址；若來源禁止外部嵌入，請改由原站觀看。</p>
                        </div>
                    </div>
                    <form id="youtubeForm" class="youtube-form">
                        <label class="field" for="youtubeUrl"><span>YouTube 網址</span>
                            <input id="youtubeUrl" name="url" type="url" inputmode="url" autocomplete="url"
                                value="https://www.youtube.com/watch?v=BsvIwqyiaJw"
                                placeholder="https://www.youtube.com/watch?v=..." required>
                            </label>
                        <button class="btn" type="submit">轉換並播放</button>
                    </form>
                    <p class="hint" id="youtubeStatus" aria-live="polite">正在確認測試影片並取得標題…</p>
                </section>
                <section class="portal-card">
                    <div class="youtube-player">
                        <iframe id="youtubePlayer" title="YouTube播放器" frameborder="0" allow="accelerometer;
                          autoplay; clipboard-write; encrypted-media; gyroscope;
                              picture-in-picture;
                              web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                        </iframe>
                    </div>
                    <div class="youtube-meta">
                        <div><span class="eyebrow">NOW PLAYING</span>
                            <h2 id="videoTitle">正在取得影片資訊…</h2>
                        </div>
                        <a class="btn secondary" id="openYoutube" href="https://www.youtube.com/watch?v=BsvIwqyiaJw"
                            target="_blank" rel="noopener noreferrer">YouTube 開啟</a>
                </section>

            </div>
        </main>
    </div>
</body>
<footer></footer>
<script type="module" src="./static/game.js"></script>
</html>
