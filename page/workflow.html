<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SOP文件｜銀盾共同體營運中心</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="icon" href="./static/ico/Github-Octicons-Cache-16.ico" type="image/x-icon">
</head>

<body>
    <div class="portal-shell">
        <aside class="portal-sidebar">
            <a class="portal-brand" href="home.html">
                <b>銀盾共同體</b>
                <small>工作面板</small>
            </a>
            <nav class="portal-nav" aria-label="內部系統導覽">
                <a href="home.html">工作台</a>
                <a href="sales.html">營運日報</a>
                <a href="exam.html">題庫練習</a>
                <a class="active" href="workflow.html">工作面板</a>
                <a href="game.html">宣導影音</a>
                <a href="staff.html">員工管理</a>
                <a href="mis.html">後台管理</a>
            </nav>
            <p class="portal-foot">內部使用</p>
        </aside>
        <main class="portal-main">
            <header class="portal-topbar">
                <span class="top-kicker">Workflow</span>
                <nav class="admin-tabs" id="staffTabs">
                    <button class="active" data-panel="pl1">SD參數讀取</button>
                    <button data-panel="pl2">環境二</button>
                    <button data-panel="pl3">環境三</button>
                    <button data-panel="pl4">環境四</button>
                </nav>
                <span class="api-state ok" id="playerState">播放器就緒</span>
            </header>
            <div class="portal-content">
                <!-- 第一個分頁內容 -->
                <section class="panel" id="pl1">
                    <h1>Stable&nbsp;Diffusion&nbsp;參數讀取器</h1>
                    <div class="card-head">
                        <!-- 拖放與點擊上傳區 -->
                        <div id="drop-zone">
                            <p>拖曳WebUI生成的PNG圖片到這裡</p>
                            <input type="file" id="file" accept="image/png" hidden>
                            <img id="img-prev" class="preview-img">
                            <p>或&nbsp;點擊此處選擇檔案</p>
                        </div>
                        <p id="err" class="error"></p>
                    </div>
                    <div class="card-head">
                        <!-- 結果顯示區 -->
                        <div id="result">
                            <label>正向提示詞&nbsp;:Prompt</label>
                            <textarea id="cp" rows="5" cols="50" readonly></textarea>

                            <label>反向提示詞&nbsp;:Negative&nbsp;Prompt</label>
                            <textarea id="cn" rows="5" cols="50" readonly></textarea>

                            <label>其他生成參數&nbsp;:Steps,&nbsp;Seed,&nbsp;Sampler...</label>
                            <br>
                            <b>偵測到的 LoRA:</b><span id="loras"></span>
                            <table border="1" cellpadding="6">
                                <tr>
                                    <th>🌱 Seed</th>
                                    <td id="m-seed">-</td>
                                </tr>
                                <tr>
                                    <th>🔢 Steps</th>
                                    <td id="m-steps">-</td>
                                </tr>
                                <tr>
                                    <th>🎚️ CFG Scale</th>
                                    <td id="m-cfg">-</td>
                                </tr>
                                <tr>
                                    <th>📐 Size</th>
                                    <td id="m-size">-</td>
                                </tr>
                                <tr>
                                    <th>🧪 Sampler</th>
                                    <td id="m-samp">-</td>
                                </tr>
                                <tr>
                                    <th>📈 Scheduler</th>
                                    <td id="m-sch">-</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </section>
                <!-- 第二個分頁內容：將 id 改為 pl2 -->
                <section class="panel" id="pl2">
                    <p>第二個分頁內容</p>
                </section>
                <section class="panel" id="pl3">
                    <p>第三個分頁內容</p>
                </section>
                <section class="panel" id="pl4">
                    <p>第四個分頁內容</p>
                </section>
            </div>
        </main>
    </div>
</body>
<footer></footer>
<script type="module" src="./static/panel.js"></script>
<script type="module" src="./static/sd_prompt.js"></script>
<script type="module" src="./static/game.js"></script>
<script type="module" src="./static/youtube_thumbnail.js"></script>


</html>
