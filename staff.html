<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>員工出缺勤｜福祿貝爾營運中心</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="portal-shell">
    <aside class="portal-sidebar">
        <a class="portal-brand" href="home.html"><img src="static/0-3-08.png" alt="福祿貝爾標誌"><span><b>福祿貝爾</b><small>MIS 出缺勤管理</small></span></a>
        <nav class="portal-nav"><a href="home.html">工作台</a><a href="sales.html">營運蒐集</a><a href="exam.html">教育訓練</a><a href="game.html">休閒專區</a><a class="active" href="staff.html">員工出缺勤</a><a href="mis.html">MIS 管理</a><a href="index.html">官方網站</a></nav>
        <p class="portal-foot">ADMIN ONLY · 需管理員登入</p>
    </aside>
    <main class="portal-main">
        <header class="portal-topbar"><div><span class="top-kicker">ATTENDANCE MANAGEMENT</span><h1>員工出缺勤</h1></div><span class="api-state" id="apiState">檢查登入狀態</span></header>
        <section class="login-shell" id="loginShell">
            <form class="login-card" id="loginForm"><img src="static/0-3-08.png" alt="福祿貝爾標誌"><h2>MIS 管理員登入</h2><p>出缺勤明細僅供授權管理人員查閱。</p><label class="field"><span>管理員帳號</span><input name="username" autocomplete="username" required></label><label class="field" style="margin-top:12px"><span>密碼</span><input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit" style="width:100%;margin-top:20px">安全登入</button><p id="loginStatus" aria-live="polite"></p></form>
        </section>
        <section class="portal-content" id="attendanceConsole" hidden>
            <div class="card-head"><div><span class="eyebrow">CLOCK RECORDS</span><h2>打卡紀錄</h2><p>依日期與員工篩選資料庫中的上、下班紀錄。</p></div><div><span class="hint" id="adminName"></span> <button class="btn secondary" id="logoutButton" type="button">登出</button></div></div>
            <form class="attendance-filter" id="filterForm"><label class="field"><span>日期</span><input name="date" type="date"></label><label class="field"><span>員工</span><select name="employee_id" id="employeeFilter"><option value="">全部員工</option></select></label><button class="btn" type="submit">查詢</button></form>
            <div class="metric-grid attendance-metrics"><article class="metric-card"><p>目前結果</p><strong id="recordCount">0</strong> 筆</article><article class="metric-card"><p>上班打卡</p><strong id="clockInCount">0</strong> 筆</article><article class="metric-card"><p>下班打卡</p><strong id="clockOutCount">0</strong> 筆</article></div>
            <section class="portal-card full"><div class="table-scroll"><table class="data-table attendance-table"><thead><tr><th>日期時間</th><th>員工編號</th><th>姓名</th><th>部門</th><th>職位</th><th>類型</th></tr></thead><tbody id="attendanceBody"><tr><td colspan="6">正在讀取…</td></tr></tbody></table></div></section>
        </section>
    </main>
</div>
<script>
const request=async(path,options={})=>{const response=await fetch(path,{credentials:'include',...options}),body=await response.json();if(!response.ok)throw new Error(body.error||'操作失敗');return body.data};
const esc=value=>{const node=document.createElement('div');node.textContent=value??'';return node.innerHTML};
const apiState=document.querySelector('#apiState'),loginShell=document.querySelector('#loginShell'),attendanceConsole=document.querySelector('#attendanceConsole'),loginForm=document.querySelector('#loginForm'),loginStatus=document.querySelector('#loginStatus'),adminName=document.querySelector('#adminName'),logoutButton=document.querySelector('#logoutButton'),filterForm=document.querySelector('#filterForm'),employeeFilter=document.querySelector('#employeeFilter'),attendanceBody=document.querySelector('#attendanceBody'),recordCount=document.querySelector('#recordCount'),clockInCount=document.querySelector('#clockInCount'),clockOutCount=document.querySelector('#clockOutCount');
let csrf='';
function showLogin(){loginShell.hidden=false;attendanceConsole.hidden=true;apiState.textContent='需要管理員登入';apiState.classList.remove('ok')}async function showConsole(session){loginShell.hidden=true;attendanceConsole.hidden=false;csrf=session.csrf;adminName.textContent=session.username;apiState.textContent='管理員已登入';apiState.classList.add('ok');const staff=await request('/api/admin/staff');employeeFilter.innerHTML='<option value="">全部員工</option>'+staff.filter(item=>item.is_active).map(item=>`<option value="${esc(item.employee_id)}">${esc(item.employee_id)}｜${esc(item.display_name)}</option>`).join('');await loadAttendance()}
async function loadAttendance(){attendanceBody.innerHTML='<tr><td colspan="6">正在讀取…</td></tr>';try{const values=new FormData(filterForm),query=new URLSearchParams();for(const [key,value] of values)if(value)query.set(key,value);const items=await request(`/api/admin/attendance?${query}`);recordCount.textContent=items.length;clockInCount.textContent=items.filter(item=>item.action==='CLOCK_IN').length;clockOutCount.textContent=items.filter(item=>item.action==='CLOCK_OUT').length;attendanceBody.innerHTML=items.length?items.map(item=>`<tr><td>${esc(new Date(item.clocked_at).toLocaleString('zh-TW'))}</td><td>${esc(item.employee_id)}</td><td>${esc(item.display_name)}</td><td>${esc(item.department)}</td><td>${esc(item.position)}</td><td><span class="tag">${item.action==='CLOCK_IN'?'上班':'下班'}</span></td></tr>`).join(''):'<tr><td colspan="6">目前沒有符合條件的打卡紀錄。</td></tr>'}catch(error){attendanceBody.innerHTML=`<tr><td colspan="6">${esc(error.message)}</td></tr>`}}
loginForm.onsubmit=async event=>{event.preventDefault();loginStatus.textContent='驗證中…';loginStatus.className='';try{const session=await request('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(loginForm)))});loginForm.reset();loginStatus.textContent='';await showConsole(session)}catch(error){loginStatus.className='error-note';loginStatus.textContent=error.message}};logoutButton.onclick=async()=>{await request('/api/admin/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});csrf='';showLogin()};filterForm.onsubmit=event=>{event.preventDefault();loadAttendance()};request('/api/admin/session').then(session=>session.authenticated?showConsole(session):showLogin()).catch(showLogin);
</script>
</body>
</html>
