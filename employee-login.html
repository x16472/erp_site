<!doctype html>
<html lang="zh-TW">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>員工相關入口｜銀盾共同體營運中心</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="employee-access-page">
    <main class="employee-access-shell">
        <section class="employee-access-brand">
            <img src="static/appicon.png" alt="銀盾共同體標誌">
            <span class="top-kicker">SILVER SHIELD OPERATIONS</span>
            <h1>員工相關入口</h1>
            <p>匯聚你工作所需一切，通往事業與福利的入口。</p>
            <a href="index.html">返回官方網站</a>
        </section>
        <section class="employee-access-card">
            <div class="live-clock access-time">
                <small>目前時間</small>
                <strong id="accessClock">--:--:--</strong>
            </div>
            <form id="accessForm">
                <label class="field"><span>員工編號</span>
                    <input name="employee_id" autocomplete="username" maxlength="20" pattern="[A-Za-z0-9_-]+"
                        placeholder="例如 K001" required autofocus></label>
                <div class="clock-actions">
                    <button class="btn" name="mode" value="CLOCK_IN" type="submit">上班打卡並進入</button>
                    <button class="btn secondary" name="mode" value="ACCESS_ONLY" type="submit">不打卡進入系統</button>
                </div>
                <p class="hint">若本日已打卡，可直接進入；系統會提示最近一次打卡時間。</p>
                <p id="accessStatus" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script>
        const
            form = document.querySelector('#accessForm'),
            statusBox = document.querySelector('#accessStatus'),
            clock = document.querySelector('#accessClock'),
            buttons = [...form.querySelectorAll('button[type="submit"]')];
        const allowedNext = new Set(['/home.html', '/sales.html', '/exam.html', '/game.html', '/staff.html', '/mis.html']);
        const requested = new URLSearchParams(location.search).get('next') || '/home.html';
        const next = allowedNext.has(requested) ? requested : '/home.html';
        let serverOffset = 0;
        const renderClock = () => clock.textContent = new Date(Date.now() + serverOffset).toLocaleString('zh-TW', { hour12: false });
        async function syncTime() {
            const started = Date.now();
            const response = await fetch('/api/time', { cache: 'no-store' });
            const body = await response.json();
            if (!response.ok) throw new Error(body.error || '校時失敗');
            const ended = Date.now();
            serverOffset = Number(body.data.unix_ms) + (ended - started) / 2 - ended; renderClock()
        }
        setInterval(renderClock, 1000);
        setInterval(() => syncTime().catch(() => { }), 60000);
        renderClock();
        syncTime().catch(() => {
            statusBox.className = 'attendance-warning';
            statusBox.textContent = '目前使用本機時間，等待伺服器重新校時。'
        });
        fetch('/api/employee/session', {
            credentials: 'include'
        }).then(r => r.json()).then(body => {
            if (body.data?.authenticated) location.replace(next)
        }).catch(() => { });
        form.addEventListener('submit', async event => {
            event.preventDefault();
            const submitter = event.submitter;
            if (!submitter) return;
            buttons.forEach(button => button.disabled = true);
            statusBox.className = '';
            statusBox.textContent = '正在驗證員工資料…';
            try {
                const employeeId = new FormData(form).get('employee_id');
                const response = await fetch('/api/employee/login', {
                    method: 'POST', credentials: 'include', headers: {
                        'Content-Type': 'application/json'
                    }, body: JSON.stringify({
                        employee_id: employeeId, mode: submitter.value
                    })
                });
                const body = await response.json();
                if (!response.ok) throw new Error(body.error || '驗證失敗');
                const attendance = body.data.attendance;
                await syncTime(); if (attendance) {
                    const occurred = new Date(attendance.clocked_at);
                    statusBox.className = 'success-note';
                    statusBox.textContent = body.data.access_mode === 'CLOCK_IN' ? `${body.data.employee.display_name}，上班打卡成功，正在進入…` : `前次打卡時間：${occurred.toLocaleString('zh-TW')}，正在進入…`
                } else {
                    statusBox.className = 'attendance-warning';
                    statusBox.textContent = '您尚未打卡，進入後請留意補打卡提醒。'
                }
                setTimeout(() => location.replace(next), 1200);
            } catch (error) {
                statusBox.className = 'error-note';
                statusBox.textContent = error.message;
                buttons.forEach(button => button.disabled = false)
            }
        });
    </script>
</body>

</html>
